version: '3.8'

services:
  mysqllab:
    image: mysql:8.0
    container_name: greenscape_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: GreenScape
      MYSQL_USER: greenscape_user
      MYSQL_PASSWORD: greenscape_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
  mongo:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    networks:
      - sql_nosql_db_net

  etcd1:
    image: quay.io/coreos/etcd:v3.5.9
    container_name: etcd1
    environment:
      ETCD_NAME: etcd1
      ETCD_INITIAL_CLUSTER: "etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380"
      ETCD_INITIAL_CLUSTER_STATE: new
      ETCD_INITIAL_CLUSTER_TOKEN: etcd-cluster
      ETCD_ADVERTISE_CLIENT_URLS: "http://etcd1:2379"
      ETCD_LISTEN_CLIENT_URLS: "http://0.0.0.0:2379"
      ETCD_INITIAL_ADVERTISE_PEER_URLS: "http://etcd1:2380"
      ETCD_LISTEN_PEER_URLS: "http://0.0.0.0:2380"
    networks:
      - sql_nosql_db_net
  monetdb:
    image: monetdb/monetdb:latest
    # platform: linux/amd64
    container_name: monetdb
    environment:
      - MDB_DB_ADMIN_PASS=monetdb
      - MDB_CREATE_DBS=sakila-db
    ports:
      - "50001:50000"  # Expose the default MonetDB port
    networks:
      - sql_nosql_db_net
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/localhost/50000' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
  neo4j:
    image: neo4j:latest
    container_name: graphs-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"  
    environment:
      - NEO4J_AUTH=neo4j/password
    networks:
      - graphs_network
    volumes:
      - ./twitter-v2/data/twitter-v2-50.dump/twitter-v2-50.dump:/twitter/data/neo4j.dump
      - ./init-db.sh:/init-db.sh
    command: bash /init-db.sh

volumes:
  mysql_data:
    driver: local

